services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_DB: reservations_exam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservations_exam"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - reservations_data:/var/lib/postgresql/data

volumes:
  reservations_data:
